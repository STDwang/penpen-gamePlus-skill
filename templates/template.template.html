<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>__GAME_TITLE__</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #0a0c10; color: #f4f6f9;
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-user-select: none; user-select: none; touch-action: none;
    }
    #app {
      position: fixed; inset: 0; overflow: hidden;
      --sl: env(safe-area-inset-left, 0px);
      --sr: env(safe-area-inset-right, 0px);
      --st: env(safe-area-inset-top, 0px);
      --sb: env(safe-area-inset-bottom, 0px);
    }
    /* 竖拿自动横转（需配合 JS 在 resize 时切 .rot，并旋转安全区变量） */
    #app.rot {
      width: 100vh; height: 100vw;
      transform-origin: top left;
      transform: rotate(90deg) translateY(-100%);
    }
    #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #veil {
      position: absolute; inset: 0; background: #0a0c10; z-index: 40;
      display: flex; align-items: center; justify-content: center;
      transition: opacity .6s ease; pointer-events: none;
    }
    #veil.off { opacity: 0; }
    #shade {
      position: absolute; inset: 0; pointer-events: none; z-index: 5;
      background: linear-gradient(180deg, rgba(0,0,0,.38) 0%, transparent 26%, transparent 72%, rgba(0,0,0,.46) 100%);
    }
    .ui-layer {
      position: absolute;
      left: var(--sl); right: var(--sr); top: var(--st); bottom: var(--sb);
      z-index: 10; pointer-events: none;
    }
    .ui-layer button { pointer-events: auto; min-width: 44px; min-height: 44px; cursor: pointer; }
    .hidden { display: none !important; }
    .dev-only { display: none; }
    body.dev .dev-only { display: block; }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="view"></canvas>
    <div id="shade"></div>
    <div id="veil"><span data-i18n="正在加载…">正在加载…</span></div>

    <div id="ui-title" class="ui-layer">
      <button id="btn-play" data-i18n="开始">开始</button>
      <button id="btn-menu" data-i18n="设置">设置</button>
    </div>

    <div id="ui-hud" class="ui-layer hidden">
      <button id="btn-pause" data-i18n="暂停">暂停</button>
    </div>

    <div id="ui-menu" class="ui-layer hidden">
      <button id="m-back" data-i18n="返回">返回</button>
    </div>
  </div>
  <script>
    "use strict";
    /*__JS__*/
  </script>
</body>
</html>
